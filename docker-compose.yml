services:
  api:
    build: ./backend
    environment:
      PORT: 8080
      APP_ENV: production
      DATABASE_PATH: /data/portfolio.db
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - portfolio_data:/data
    ports:
      - "8080:8080"
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      API_URL: http://api:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api
    ports:
      - "3000:3000"
volumes:
  portfolio_data:
